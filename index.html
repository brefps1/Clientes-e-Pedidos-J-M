<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Nuvem - Açaí J & M v12.5</title>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; display: flex; flex-direction: row; min-height: 100vh; }
        #login-screen { position: fixed; inset:0; background:#2e1065; display:flex; justify-content:center; align-items:center; z-index:9999; padding:20px; }
        .login-card { background: white; padding: 40px; border-radius: 12px; width: 100%; max-width: 400px; text-align: center; }
        #top-header { background: #2e1065; color: white; padding: 15px 25px; display: flex; justify-content: space-between; position: fixed; top: 0; width: 100%; z-index: 999; }
        #sidebar { width: 250px; background: #1e1b4b; color: white; padding: 20px; position: fixed; top: 60px; bottom: 0; }
        .nav-btn { width: 100%; padding: 12px; margin-bottom: 10px; background: none; border: none; color: #cbd5e1; cursor: pointer; text-align: left; font-weight: 600; border-radius: 6px; }
        .nav-btn.active { background: #a855f7; color: white; }
        #content { flex: 1; margin-left: 250px; margin-top: 60px; padding: 30px; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ddd; border-radius: 4px; }
        .btn { background: #a855f7; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 4px; font-weight: bold; width: 100%; margin-top: 10px; }
        .btn-danger { background: #ef4444; }
        .btn-success { background: #22c55e; }
        .table-responsive { overflow-x: auto; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        @media print { #sidebar, #top-header, .no-print { display: none !important; } #content { margin: 0; padding: 0; } }
    </style>
</head>
<body>
    <div id="login-screen">
        <div class="login-card">
            <h2>🍇 Açaí J & M</h2>
            <input type="text" id="login-usuario" placeholder="Usuário">
            <input type="password" id="login-senha" placeholder="Senha">
            <button class="btn" onclick="efetuarLogin()">Entrar</button>
        </div>
    </div>

    <div id="top-header"><h1>Painel Nuvem</h1><button onclick="efetuarLogout()">Sair</button></div>

    <div id="sidebar">
        <button class="nav-btn active" id="btn-clientes" onclick="showSection('clientes')">👥 Clientes</button>
        <button class="nav-btn" id="btn-pedidos" onclick="showSection('pedidos')">🛒 Novo Pedido</button>
        <button class="nav-btn" id="btn-historico" onclick="showSection('historico')">📜 Histórico</button>
        <button class="nav-btn" id="btn-caixa" onclick="showSection('caixa')">💰 Caixa</button>
        <button class="nav-btn" id="btn-receitas" onclick="showSection('receitas')">📖 Receitas</button>
        <button class="nav-btn" id="btn-equipe" onclick="showSection('equipe')" style="display:none;">⚙️ Equipe</button>
    </div>

    <div id="content">
        <div id="sec-clientes" class="section">
            <div class="card"><h3>Clientes</h3><input type="text" id="busca-cli" placeholder="Buscar..." onkeyup="carregarClientes()"><div class="table-responsive"><table id="tab-clientes"><thead><tr><th>Nome</th><th>Whats</th></tr></thead><tbody></tbody></table></div></div>
        </div>
        
        <div id="sec-pedidos" class="section" style="display:none;">
            <div class="card"><h3>Novo Pedido</h3><input type="text" id="ped-cli" placeholder="Nome"><input type="text" id="ped-det" placeholder="Detalhes"><select id="ped-pag"><option>Pix</option><option>Dinheiro</option><option>Cartão</option></select><input type="number" id="ped-val" placeholder="Valor"><button class="btn btn-success" onclick="salvarPedido()">Salvar</button></div>
        </div>

        <div id="sec-historico" class="section" style="display:none;">
            <div class="card"><h3>Histórico</h3><div class="table-responsive"><table id="tab-pedidos"><thead><tr><th>ID</th><th>Cliente</th><th>Detalhes</th><th>Valor</th></tr></thead><tbody></tbody></table></div></div>
        </div>

        <div id="sec-caixa" class="section" style="display:none;">
            <div class="card"><h3>Caixa</h3><button class="btn no-print" onclick="window.print()">🖨️ Imprimir Relatório</button><div class="table-responsive"><table id="tab-caixa"><thead><tr><th>ID</th><th>Cliente</th><th>Pagamento</th><th>Valor</th></tr></thead><tbody></tbody></table></div><h3>Total: R$ <span id="caixa-total">0.00</span></h3></div>
        </div>
        
        <div id="sec-receitas" class="section" style="display:none;"></div>
        <div id="sec-equipe" class="section" style="display:none;"></div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyCIplhwGak1WWC1dbdRaDkSnOmu_QgTi48", authDomain: "acaijm.firebaseapp.com", projectId: "acaijm", storageBucket: "acaijm.firebasestorage.app", messagingSenderId: "681853604158", appId: "1:681853604158:web:c2117e36e633b672bf5c6f" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        window.onload = () => { const s = localStorage.getItem('db_user_logado'); if(s) { document.getElementById('login-screen').style.display='none'; showSection('clientes'); } };

        async function efetuarLogin() {
            const u = document.getElementById('login-usuario').value.toLowerCase();
            const s = document.getElementById('login-senha').value;
            const snap = await db.collection('funcionarios').where('usuario','==',u).where('senha','==',s).get();
            if(!snap.empty) { localStorage.setItem('db_user_logado', u); location.reload(); } else alert("Erro!");
        }

        function efetuarLogout() { localStorage.removeItem('db_user_logado'); location.reload(); }

        function showSection(id) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.getElementById('sec-' + id).style.display = 'block';
            if(id === 'historico') carregarHistorico();
            if(id === 'caixa') calcularCaixa();
        }

        async function salvarPedido() {
            const ref = db.collection('config').doc('contador');
            const doc = await ref.get();
            let num = doc.exists ? doc.data().ultimo_pedido + 1 : 1;
            const numF = String(num).padStart(4, '0');
            await db.collection('pedidos').add({ 
                numero: numF, 
                cliente: document.getElementById('ped-cli').value, 
                detalhes: document.getElementById('ped-det').value, 
                pagamento: document.getElementById('ped-pag').value, 
                valor: parseFloat(document.getElementById('ped-val').value), 
                status: 'Finalizado', 
                data: new Date().toISOString() 
            });
            await ref.set({ ultimo_pedido: num });
            alert('Pedido #' + numF + ' salvo!');
        }

        async function carregarHistorico() {
            const t = document.querySelector('#tab-pedidos tbody'); t.innerHTML = '';
            const snap = await db.collection('pedidos').orderBy('numero', 'desc').get();
            snap.forEach(d => { const p = d.data(); t.innerHTML += `<tr><td>#${p.numero}</td><td>${p.cliente}</td><td>${p.detalhes}</td><td>R$ ${p.valor.toFixed(2)}</td></tr>`; });
        }

        async function calcularCaixa() {
            const t = document.querySelector('#tab-caixa tbody'); t.innerHTML = '';
            let total = 0;
            const snap = await db.collection('pedidos').where('status','==','Finalizado').orderBy('numero','asc').get();
            snap.forEach(d => { const p = d.data(); total += p.valor; t.innerHTML += `<tr><td>#${p.numero}</td><td>${p.cliente}</td><td>${p.pagamento}</td><td>R$ ${p.valor.toFixed(2)}</td></tr>`; });
            document.getElementById('caixa-total').innerText = total.toFixed(2);
        }
    </script>
</body>
</html>
