<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel de Controle - Vendas V2</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 0; }
        body { background-color: #f4f6f9; display: flex; }
        #sidebar { width: 250px; background-color: #1e293b; color: white; height: 100vh; padding: 20px; position: fixed; }
        #sidebar h2 { margin-bottom: 30px; font-size: 20px; text-align: center; color: #38bdf8; }
        .nav-btn { display: block; width: 100%; padding: 12px; background: none; border: none; color: #94a3b8; text-align: left; font-size: 16px; cursor: pointer; border-radius: 6px; margin-bottom: 10px; font-weight: 500; }
        .nav-btn.active, .nav-btn:hover { background-color: #334155; color: white; }
        #content { flex: 1; margin-left: 250px; padding: 40px; overflow-y: auto; min-height: 100vh; }
        .card { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
        h3 { margin-bottom: 20px; color: #1e293b; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; color: #475569; }
        input, select { width: 100%; padding: 10px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 14px; }
        button.btn { background-color: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        button.btn:hover { background-color: #1d4ed8; }
        button.btn-danger { background-color: #ef4444; }
        button.btn-danger:hover { background-color: #dc2626; }
        button.btn-success { background-color: #22c55e; }
        button.btn-success:hover { background-color: #16a34a; }
        .search-box { margin-bottom: 20px; padding: 10px; font-size: 16px; border: 2px solid #2563eb; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
        th { background-color: #f8fafc; color: #64748b; }
        .badge { padding: 6px 12px; border-radius: 50px; font-size: 12px; font-weight: bold; display: inline-block; }
        .badge-pendente { background: #fef3c7; color: #d97706; }
        .badge-finalizado { background: #dcfce7; color: #15803d; }
        .action-btns button { padding: 6px 10px; margin-right: 5px; border: none; border-radius: 4px; cursor: pointer; font-size: 12px; font-weight: bold; }
    </style>
</head>
<body>

    <div id="sidebar">
        <h2>Painel Controle v2</h2>
        <button class="nav-btn active" id="btn-clientes" onclick="showSection('clientes')">Clientes & Endereços</button>
        <button class="nav-btn" id="btn-pedidos" onclick="showSection('pedidos')">Novo Pedido</button>
        <button class="nav-btn" id="btn-historico" onclick="showSection('historico')">Histórico de Pedidos</button>
    </div>

    <div id="content">
        <div id="sec-clientes" class="section">
            <div class="card">
                <h3 id="form-cliente-titulo">Cadastrar Novo Cliente</h3>
                <input type="hidden" id="cli-idx" value="">
                <div class="form-group">
                    <label>Nome do Cliente</label>
                    <input type="text" id="cli-nome" placeholder="Ex: Maria Souza">
                </div>
                <div class="form-group">
                    <label>WhatsApp</label>
                    <input type="text" id="cli-whats" placeholder="(11) 99999-9999">
                </div>
                <div class="form-group">
                    <label>Endereço de Entrega Padrão</label>
                    <input type="text" id="cli-end" placeholder="Rua, Número, Bairro, Cidade">
                </div>
                <button class="btn" id="btn-salvar-cliente" onclick="salvarCliente()">Salvar Cliente</button>
                <button class="btn btn-danger" id="btn-cancelar-edit" onclick="cancelarEdicao()" style="display:none;">Cancelar Edição</button>
            </div>

            <div class="card">
                <h3>Clientes Cadastrados</h3>
                <input type="text" id="busca-cliente" class="search-box" placeholder="🔎 Procurar cliente por nome ou WhatsApp..." onkeyup="carregarClientes()">
                <table id="tab-clientes">
                    <thead>
                        <tr><th>Nome</th><th>WhatsApp</th><th>Endereço Padrão</th><th>Ações</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>

        <div id="sec-pedidos" class="section" style="display:none;">
            <div class="card">
                <h3>Registrar Novo Pedido</h3>
                <div class="form-group">
                    <label>Selecione o Cliente</label>
                    <select id="ped-cliente" onchange="atualizarEnderecoPedido()"></select>
                </div>
                <div class="form-group">
                    <label>Endereço de Entrega (Puxado automático, altere se necessário)</label>
                    <input type="text" id="ped-end">
                </div>
                <div class="form-group">
                    <label>Detalhes do Pedido (Produtos)</label>
                    <input type="text" id="ped-detalhes" placeholder="Ex: 2x Hamburguer + 1x Batata">
                </div>
                <div class="form-group">
                    <label>Valor Total (R$)</label>
                    <input type="number" step="0.01" id="ped-valor" placeholder="0.00">
                </div>
                <button class="btn btn-success" onclick="salvarPedido()">Confirmar Pedido</button>
            </div>
        </div>

        <div id="sec-historico" class="section" style="display:none;">
            <div class="card">
                <h3>Histórico Geral de Pedidos</h3>
                <table id="tab-pedidos">
                    <thead>
                        <tr><th>Cliente</th><th>Produtos</th><th>Endereço Utilizado</th><th>Valor</th><th>Status</th><th>Ações</th></tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let clientes = JSON.parse(localStorage.getItem('db_clientes')) || [];
        let pedidos = JSON.parse(localStorage.getItem('db_pedidos')) || [];

        function showSection(sectionId) {
            document.querySelectorAll('.section').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            
            document.getElementById('sec-' + sectionId).style.display = 'block';
            document.getElementById('btn-' + sectionId).classList.add('active');
            
            if(sectionId === 'clientes') carregarClientes();
            if(sectionId === 'pedidos') { carregarSelectClientes(); atualizarEnderecoPedido(); }
            if(sectionId === 'historico') carregarHistorico();
        }

        function salvarCliente() {
            const idx = document.getElementById('cli-idx').value;
            const nome = document.getElementById('cli-nome').value.trim();
            const whats = document.getElementById('cli-whats').value.trim();
            const end = document.getElementById('cli-end').value.trim();

            if(!nome || !end) return alert('Nome e Endereço são obrigatórios!');

            if(idx === "") {
                // Novo Cadastro
                clientes.push({ id: Date.now(), nome, whats, end });
            } else {
                // Atualizando Existente
                clientes[idx].nome = nome;
                clientes[idx].whats = whats;
                clientes[idx].end = end;
                cancelarEdicao();
            }

            localStorage.setItem('db_clientes', JSON.stringify(clientes));
            
            document.getElementById('cli-nome').value = '';
            document.getElementById('cli-whats').value = '';
            document.getElementById('cli-end').value = '';
            
            carregarClientes();
            alert('Dados salvos com sucesso!');
        }

        function carregarClientes() {
            const tbody = document.querySelector('#tab-clientes tbody');
            const termo = document.getElementById('busca-cliente').value.toLowerCase();
            tbody.innerHTML = '';
            
            clientes.forEach((c, index) => {
                if(c.nome.toLowerCase().includes(termo) || c.whats.toLowerCase().includes(termo)) {
                    tbody.innerHTML += `<tr>
                        <td><b>${c.nome}</b></td>
                        <td>${c.whats}</td>
                        <td>${c.end}</td>
                        <td class="action-btns">
                            <button class="btn-success" style="color:white;" onclick="atalhoNovoPedido(${c.id})">Novo Pedido</button>
                            <button style="background-color: #e2e8f0;" onclick="prepararEdicao(${index})">Editar</button>
                            <button class="btn-danger" style="color:white;" onclick="excluirCliente(${index})">Excluir</button>
                        </td>
                    </tr>`;
                }
            });
        }

        function prepararEdicao(index) {
            const c = clientes[index];
            document.getElementById('cli-idx').value = index;
            document.getElementById('cli-nome').value = c.nome;
            document.getElementById('cli-whats').value = c.whats;
            document.getElementById('cli-end').value = c.end;
            
            document.getElementById('form-cliente-titulo').innerText = "Editar Dados do Cliente";
            document.getElementById('btn-salvar-cliente').innerText = "Salvar Alterações";
            document.getElementById('btn-cancelar-edit').style.display = "inline-block";
            window.scrollTo({top: 0, behavior: 'smooth'});
        }

        function cancelarEdicao() {
            document.getElementById('cli-idx').value = "";
            document.getElementById('cli-nome').value = "";
            document.getElementById('cli-whats').value = "";
            document.getElementById('cli-end').value = "";
            document.getElementById('form-cliente-titulo').innerText = "Cadastrar Novo Cliente";
            document.getElementById('btn-salvar-cliente').innerText = "Salvar Cliente";
            document.getElementById('btn-cancelar-edit').style.display = "none";
        }

        function excluirCliente(index) {
            if(confirm("Tem certeza que deseja excluir este cliente?")) {
                clientes.splice(index, 1);
                localStorage.setItem('db_clientes', JSON.stringify(clientes));
                carregarClientes();
            }
        }

        function carregarSelectClientes(selecionarId = null) {
            const select = document.getElementById('ped-cliente');
            select.innerHTML = '<option value="">Selecione um cliente...</option>';
            clientes.forEach(c => {
                const selected = selecionarId == c.id ? 'selected' : '';
                select.innerHTML += `<option value="${c.id}" ${selected}>${c.nome}</option>`;
            });
        }

        function atualizarEnderecoPedido() {
            const idCli = document.getElementById('ped-cliente').value;
            const cli = clientes.find(c => c.id == idCli);
            document.getElementById('ped-end').value = cli ? cli.end : '';
        }

        function atalhoNovoPedido(idCliente) {
            showSection('pedidos');
            carregarSelectClientes(idCliente);
            atualizarEnderecoPedido();
        }

        function salvarPedido() {
            const idCli = document.getElementById('ped-cliente').value;
            const cli = clientes.find(c => c.id == idCli);
            const enderecoEntrega = document.getElementById('ped-end').value.trim();
            const detalhes = document.getElementById('ped-detalhes').value.trim();
            const valor = document.getElementById('ped-valor').value;

            if(!cli || !detalhes || !valor || !enderecoEntrega) return alert('Por favor, preencha todos os campos do pedido!');

            pedidos.push({
                id: Date.now(),
                cliente: cli.nome,
                endereco: enderecoEntrega,
                detalhes,
                valor,
                status: 'Pendente'
            });

            localStorage.setItem('db_pedidos', JSON.stringify(pedidos));
            
            document.getElementById('ped-detalhes').value = '';
            document.getElementById('ped-valor').value = '';
            
            alert('Pedido registrado com sucesso!');
            showSection('historico');
        }

        function carregarHistorico() {
            const tbody = document.querySelector('#tab-pedidos tbody');
            tbody.innerHTML = '';
            pedidos.forEach((p, index) => {
                const badgeClass = p.status === 'Pendente' ? 'badge-pendente' : 'badge-finalizado';
                const botaoStatus = p.status === 'Pendente' 
                    ? `<button class="btn-success" style="color:white;" onclick="alterarStatusPedido(${index}, 'Finalizado')">✅ Finalizar</button>` 
                    : `<button style="background-color:#cbd5e1;" onclick="alterarStatusPedido(${index}, 'Pendente')">🔄 Reabrir</button>`;

                tbody.innerHTML += `<tr>
                    <td><b>${p.cliente}</b></td>
                    <td>${p.detalhes}</td>
                    <td>${p.endereco}</td>
                    <td>R$ ${parseFloat(p.valor).toFixed(2)}</td>
                    <td><span class="badge ${badgeClass}">${p.status}</span></td>
                    <td class="action-btns">
                        ${botaoStatus}
                        <button class="btn-danger" style="color:white;" onclick="excluirPedido(${index})">Excluir</button>
                    </td>
                </tr>`;
            });
        }

        function alterarStatusPedido(index, novoStatus) {
            pedidos[index].status = novoStatus;
            localStorage.setItem('db_pedidos', JSON.stringify(pedidos));
            carregarHistorico();
        }

        function excluirPedido(index) {
            if(confirm("Deseja apagar este pedido do histórico?")) {
                pedidos.splice(index, 1);
                localStorage.setItem('db_pedidos', JSON.stringify(pedidos));
                carregarHistorico();
            }
        }

        // Inicialização
        carregarClientes();
    </script>
</body>
</html>
